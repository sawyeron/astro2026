name: Verify Astro site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 · format · lint · check · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@1e60f620b9541dca151540ad759f7413b67dd1f0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: git diff --exit-code
