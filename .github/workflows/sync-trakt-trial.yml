name: Trakt cloud trial

on:
  push:
    branches: [ci/trakt-cloud-trial]
    paths: [.github/workflows/sync-trakt-trial.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trakt-cloud-trial
  cancel-in-progress: false

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test snapshot policies and isolated failure regressions
        run: node --test scripts/movie-enrichment-plan.test.mjs scripts/enrich-movie-posters.integration.test.mjs scripts/sync-trakt-public.integration.test.mjs
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chrome
      - name: Read existing candidate as data only
        run: |
          git ls-remote --heads origin automation/trakt-trial-data > "$RUNNER_TEMP/trakt-candidate-ref"
          if test -s "$RUNNER_TEMP/trakt-candidate-ref"; then
            git fetch --no-tags origin refs/heads/automation/trakt-trial-data
            git show FETCH_HEAD:src/data/trakt-public-history.json > "$RUNNER_TEMP/trakt-existing-candidate.json"
          fi
      - name: Back up input snapshot
        run: cp src/data/trakt-public-history.json "$RUNNER_TEMP/trakt-before.json"
      - name: Fetch public history without credentials
        run: npm run sync:trakt-public
      - name: Validate history before enrichment
        run: npm run check:movies:data
      - name: Reject removal of previously committed history events
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const before = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trakt-before.json`, 'utf8'));
          const after = JSON.parse(await readFile('src/data/trakt-public-history.json', 'utf8'));
          const ids = new Set(after.history.map(entry => entry.id));
          const removed = before.history.filter(entry => !ids.has(entry.id)).length;
          if (removed) throw new Error(`Refusing automated removal of ${removed} history events; manual review required`);
          NODE
      - name: Trial TMDB enrichment through approved proxy
        env:
          TMDB_PROXY_API_KEY: ${{ secrets.TMDB_PROXY_API_KEY }}
          TMDB_PROXY_BASE: ${{ vars.TMDB_PROXY_BASE }}
        run: npm run enrich:movie-posters -- --previous "$RUNNER_TEMP/trakt-before.json"
      - name: Validate enriched candidate snapshot
        run: npm run check:movies:data
      - name: Summarize changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from 'node:fs/promises';
          const before = JSON.parse(await readFile(`${process.env.RUNNER_TEMP}/trakt-before.json`, 'utf8'));
          const after = JSON.parse(await readFile('src/data/trakt-public-history.json', 'utf8'));
          const oldIds = new Set(before.history.map(e => e.id));
          const newIds = new Set(after.history.map(e => e.id));
          const report = {
            before: before.counts,
            after: after.counts,
            pages: after.pageCount,
            added: after.history.filter(e => !oldIds.has(e.id)).length,
            removed: before.history.filter(e => !newIds.has(e.id)).length,
            remotePosters: [...after.movies, ...after.shows].filter(e => e.posterRemote).length,
            note: 'Validated candidate will be proposed to the trial branch only; no automatic merge or production publication.'
          };
          await appendFile(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(report, null, 2) + '\n```\n');
          NODE
      - name: Ignore timestamp-only changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { existsSync } from 'node:fs';
          import { sameSnapshotContent } from './scripts/movie-enrichment-plan.mjs';
          const file = 'src/data/trakt-public-history.json';
          const original = await readFile(`${process.env.RUNNER_TEMP}/trakt-before.json`, 'utf8');
          const before = JSON.parse(original);
          const after = JSON.parse(await readFile(file, 'utf8'));
          if (sameSnapshotContent(before, after)) {
            await writeFile(file, original);
          } else {
            const candidatePath = `${process.env.RUNNER_TEMP}/trakt-existing-candidate.json`;
            if (existsSync(candidatePath)) {
              const candidate = await readFile(candidatePath, 'utf8');
              if (sameSnapshotContent(JSON.parse(candidate), after)) await writeFile(file, candidate);
            }
          }
          NODE
      - name: Verify site with candidate data
        run: npm run verify
      - name: Preserve validated candidate before PR action resets checkout
        run: cp src/data/trakt-public-history.json "$RUNNER_TEMP/trakt-validated-candidate.json"
      - name: Create repository-scoped App token after validation
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3 (Node 24)
        with:
          app-id: ${{ vars.TRAKT_SYNC_APP_ID }}
          private-key: ${{ secrets.TRAKT_SYNC_APP_PRIVATE_KEY }}
          owner: sawyeron
          repositories: astro2026
          permission-contents: write
          permission-pull-requests: write
      - name: Propose snapshot to trial branch only
        id: candidate_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8 (Node 24)
        with:
          token: ${{ steps.app_token.outputs.token }}
          base: ci/trakt-cloud-trial
          branch: automation/trakt-trial-data
          add-paths: src/data/trakt-public-history.json
          title: "Review cloud-synchronized Trakt candidate"
          commit-message: |
            Topic: Update cloud Trakt candidate snapshot

            Describe(What):

                * What: Refresh public viewing history and verified poster references.
                * Why: Review cloud synchronization without publishing production.
                * How: Validate data and run the full site verification before proposing the snapshot.

            Related: Trakt cloud trial.
          body: |
            This PR targets **ci/trakt-cloud-trial**, not main. No automatic merge is configured.
            Only the public viewing snapshot is proposed; TMDB credentials are not included.
            Data checks and full site verification ran in the creating workflow.
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Inspect the separate Verify Astro site check. This update uses a repository-scoped GitHub App token.
            If the check is missing or awaits approval, investigate the run and repository policy; do not bypass protections.
            Do not bypass required checks or retarget this trial PR to main.
      - name: Verify PR snapshot matches preserved artifact input
        env:
          CANDIDATE_SHA: ${{ steps.candidate_pr.outputs.pull-request-head-sha }}
          PR_OPERATION: ${{ steps.candidate_pr.outputs.pull-request-operation }}
        run: |
          if test -n "$CANDIDATE_SHA"; then
            git fetch --no-tags origin "$CANDIDATE_SHA"
            git show FETCH_HEAD:src/data/trakt-public-history.json > "$RUNNER_TEMP/trakt-pr-output.json"
            cmp "$RUNNER_TEMP/trakt-pr-output.json" "$RUNNER_TEMP/trakt-validated-candidate.json"
          else
            cmp src/data/trakt-public-history.json "$RUNNER_TEMP/trakt-validated-candidate.json"
          fi
          sha256sum "$RUNNER_TEMP/trakt-validated-candidate.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\nPR operation: %s\n' "$PR_OPERATION" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validated candidate (public history only)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node 24)
        with:
          name: trakt-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/trakt-validated-candidate.json
          retention-days: 7
          if-no-files-found: error
